name: Renew TestFlight

on:
  workflow_dispatch: {}
  schedule:
    # EAS cron uses GMT. 02:00 GMT is 09:00 in Vietnam.
    # Renew every two months, comfortably before TestFlight's 90-day expiry.
    - cron: "0 2 1 */2 *"

jobs:
  build_ios:
    name: Build iOS production
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit to App Store Connect
    needs: [build_ios]
    type: submit
    environment: production
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: automated

  distribute_testflight:
    name: Distribute to TestFlight
    needs: [build_ios, submit_ios]
    environment: production
    env:
      ASC_APP_ID: "6760104438"
      BUILD_NUMBER: ${{ needs.build_ios.outputs.app_build_version }}
      EXTERNAL_GROUP_NAME: "Testing"
    steps:
      - uses: eas/checkout
      - name: Add build to external testing
        run: node scripts/distribute-testflight.mjs
