name: Renew TestFlight

on:
  workflow_dispatch: {}
  schedule:
    # EAS cron uses GMT. 02:00 GMT is 09:00 in Vietnam.
    - cron: "0 2 1 */2 *"

jobs:
  build_ios:
    name: Build iOS production
    type: build
    params:
      platform: ios
      profile: production

  distribute_testflight:
    name: Distribute to TestFlight
    needs: [build_ios]
    type: testflight
    environment: production
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: automated
      external_groups:
        - Testing
      changelog: "Bản gia hạn TestFlight định kỳ cho nhân viên."
      submit_beta_review: true
      wait_processing_timeout_seconds: 1800
